# Netlify adds the visitor's IP to X-Forwarded-For on proxied requests. Proxy redirects can't
# drop request headers, so your site's cookies are forwarded on both routes; quickstatus.dev and
# the collector ignore them. If your cookies must not leave your domain, load the script from
# https://quickstatus.dev/qs.js and proxy only /qs/e through an Edge Function that drops them
# (the Cloudflare Worker recipe is the same code).
[[redirects]]
  from = "/qs.js"
  to = "https://quickstatus.dev/qs.js"
  status = 200

[[redirects]]
  from = "/qs/e"
  to = "https://a.quickstatus.dev/e"
  status = 200
  force = true
  headers = {X-QS-Proxy = "1"}
