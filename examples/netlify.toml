# Netlify adds the visitor's IP to X-Forwarded-For on proxied requests. Proxy redirects can't
# drop request headers, so your site's cookies are forwarded too; the collector ignores them.
[[redirects]]
  from = "/qs.js"
  to = "https://quickstatus.dev/qs.js"
  status = 200

[[redirects]]
  from = "/qs/e"
  to = "https://a.quickstatus.dev/e"
  status = 200
  force = true
  headers = {X-QS-Proxy = "1"}
