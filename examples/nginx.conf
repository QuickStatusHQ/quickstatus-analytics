# Inside your server { } block.
location = /qs.js {
    proxy_pass https://quickstatus.dev/qs.js;
    proxy_set_header Host quickstatus.dev;
    proxy_ssl_server_name on;
    proxy_cache_valid 200 5m;
}

location = /qs/e {
    proxy_pass https://a.quickstatus.dev/e;
    proxy_set_header Host a.quickstatus.dev;
    proxy_ssl_server_name on;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-QS-Proxy 1;
    proxy_set_header User-Agent $http_user_agent;
    proxy_set_header Cookie "";
}
