# Tag vX.Y.Z -> GitHub release with qs.js, qs@X.Y.Z.js, SHA256SUMS and SRI hashes.
name: release
on:
  push: {tags: ['v*.*.*']}
permissions:
  contents: read
jobs:
  # The same gates as test.yml, so a tag can't ship what main wouldn't. A job of its own with a
  # read-only token: the packages pip installs here never run next to the release token.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: {persist-credentials: false}
      - run: node --test test/*.test.mjs
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: '3.12'}
      - name: Collector tests
        working-directory: collector
        run: pip install -e '.[test]' && pytest -q
      - name: Size budget (3 KB gzipped)
        run: '[ "$(gzip -9c src/qs.js | wc -c)" -le 3072 ]'
  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: {persist-credentials: false}
      - name: Version matches the tag
        run: |
          v="$(sed -n 's|^/\*! QuickStatus.dev analytics v\([0-9.]*\) .*|\1|p' src/qs.js)"
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "qs.js header $v != tag $GITHUB_REF_NAME"; exit 1; }
      - name: Assets
        run: |
          mkdir dist
          cp src/qs.js dist/qs.js
          cp src/qs.js "dist/qs@${GITHUB_REF_NAME#v}.js"
          cp schema/event.v1.json data/sources.json dist/
          (cd dist && sha256sum * > SHA256SUMS && for f in qs*.js; do echo "$f sha384-$(openssl dgst -sha384 -binary "$f" | openssl base64 -A)"; done > SRI)
      - name: GitHub release
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-from-tag --verify-tag
